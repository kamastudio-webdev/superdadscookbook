[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Send the "no s" domain to the main domain, keeping the page path.
[[redirects]]
  from = "https://superdadcookbook.com/*"
  to = "https://superdadscookbook.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://superdadcookbook.com/*"
  to = "https://superdadscookbook.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.superdadcookbook.com/*"
  to = "https://superdadscookbook.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.superdadcookbook.com/*"
  to = "https://superdadscookbook.com/:splat"
  status = 301
  force = true

# Built files have unique names, so browsers can cache them for a long time.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
